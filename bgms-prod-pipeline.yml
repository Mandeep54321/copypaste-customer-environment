#-------------------------------------------------------------------------------
# Finance Database
#-------------------------------------------------------------------------------
- stage:                  cef_database
  displayName:            CEF Database
  variables:
  - template:             ../../common/legacy/cef-general-variables.yml
  jobs:
  - template:             cef/database/upgrade_cef_db.yml@templates
    parameters:
      environment:        ${{ parameters.deploymentEnvironment }}
      environmentTag:     Tool
      artifact:           'CEFinance-2.5.6-cefprod'
      artifactSubFolder:  'dbupgrade'

#-------------------------------------------------------------------------------
# Finance Presentation
#-------------------------------------------------------------------------------
- stage:                  cef_presentation
  displayName:            CEF Presentation
  dependsOn:              cef_database
  variables:
  - template:             ../../common/legacy/cef-general-variables.yml
  jobs:
  - template:             cef/web/cefinance_redirect.yml@templates
    parameters:
      siteName:           'CE Finance ${{ parameters.deploymentEnvironment }}'
      appPool:            'CE Finance ${{ parameters.deploymentEnvironment }}'
      remoteRepo:         true
      environment:        ${{ parameters.deploymentEnvironment }}
      environmentTag:     Finance
      isDevEnv:           false
      useMaintenancePage: false
  - template:             cef/web/cefinance-legacy.yml@templates
    parameters:
      siteName:           'CE Finance ${{ parameters.deploymentEnvironment }}'
      appName:            'cefinance'
      appPool:            'cefinance ${{ parameters.deploymentEnvironment }}'
      remoteRepo:         true
      environment:        ${{ parameters.deploymentEnvironment }}
      environmentTag:     Finance
      artifact:           'CEFinance-2.5.5-cefprod'
      zipArtifact:        'CEFinance-2.5.5-zips'
      zipScripts:
      - name:             'Expand-FinanceArchives.ps1'
        arguments:        '-Destination "$(webapp.path.finance)" -Filter ''.*.((BASE|OIDC)|(CEF)[0-9]{0,3}).zip'''
