#-------------------------------------------------------------------------------
# CES Processing
#-------------------------------------------------------------------------------
- stage:                  ces_processing
  displayName:            CES Processing
  dependsOn:
  - licence
  - ces_database
  variables:
  - template:             ../../common/legacy/ces-general-variables.yml
  jobs:
  # CES Archive Job Executor
  - template:             ces/processing/archive_job_executor.yml@templates
    parameters:
      serviceName:        'CESArchiveJobExecutor-${{ parameters.deploymentEnvironment }}'
      remoteRepo:         true
      extraVariables:     variables/common/ces-archive-job-executor-variables.yml
      environment:        ${{ parameters.deploymentEnvironment }}
      environmentTag:     Processing
  # CES Audit Consumer
  - template:             ces/processing/audit_consumer.yml@templates
    parameters:
      serviceName:        'CESAuditAMQPConsumers-${{ parameters.deploymentEnvironment }}'
      remoteRepo:         true
      extraVariables:     variables/common/ces-audit-consumer-variables.yml
      environment:        ${{ parameters.deploymentEnvironment }}
      environmentTag:     Processing
  # CES Portal Consumers
  - template:             ces/processing/ces_portal_consumers.yml@templates
    parameters:
      serviceName:        'CESAMQPConsumers-${{ parameters.deploymentEnvironment }}'
      remoteRepo:         true
      extraVariables:     variables/common/ces-portal-consumers-variables.yml
      environment:        ${{ parameters.deploymentEnvironment }}
      environmentTag:     Processing
  # CES Communication Consumer Email
  - template:             ces/processing/comms_consumer_email.yml@templates
    parameters:
      serviceName:        'CESCommCenterAMQPConsumersEmail-${{ parameters.deploymentEnvironment }}'
      remoteRepo:         true
      extraVariables:     variables/common/ces-comms-consumer-email-variables.yml
      environment:        ${{ parameters.deploymentEnvironment }}
      environmentTag:     Processing
  # CES Communication Consumer SMS
  - template:             ces/processing/comms_consumer_sms.yml@templates
    parameters:
      serviceName:        'CESCommCenterAMQPConsumersSMS-${{ parameters.deploymentEnvironment }}'
      remoteRepo:         true
      extraVariables:     variables/common/ces-comms-consumer-sms-variables.yml
      environment:        ${{ parameters.deploymentEnvironment }}
      environmentTag:     Processing
        #- template: ces/processing/event_worker.yml@templates
        #  parameters:
        #    serviceName: 'CommunityPortalAuditors-${{ parameters.deploymentEnvironment }}'
  # CES Finance Job Executor
  - template:             ces/processing/finance_job_executor.yml@templates
    parameters:
      serviceName:        'CESFinanceJobExecutor-${{ parameters.deploymentEnvironment }}'
      remoteRepo:         true
      extraVariables:     variables/common/ces-finance-job-executor-variables.yml
      environment:        ${{ parameters.deploymentEnvironment }}
      environmentTag:     Processing
  # CES General Job Executor
  - template:             ces/processing/general_job_executor.yml@templates
    parameters:
      serviceName:        'CESGeneralJobExecutor-${{ parameters.deploymentEnvironment }}'
      remoteRepo:         true
      extraVariables:     variables/common/ces-general-job-executor-variables.yml
      environment:        ${{ parameters.deploymentEnvironment }}
      environmentTag:     Processing
  # CES Portal Job Executor
  - template:             ces/processing/portal_job_executor.yml@templates
    parameters:
      serviceName:        'CESJobExecutor-${{ parameters.deploymentEnvironment }}'
      remoteRepo:         true
      extraVariables:     variables/common/ces-portal-job-executor-variables.yml
      environment:        ${{ parameters.deploymentEnvironment }}
      environmentTag:     Processing
  # CES Processing Consumers
  - template:             ces/processing/processing_consumers.yml@templates
    parameters:
      serviceName:        'CESProcessingConsumers-${{ parameters.deploymentEnvironment }}'
      remoteRepo:         true
      extraVariables:     variables/common/ces-processing-consumers-variables.yml
      environment:        ${{ parameters.deploymentEnvironment }}
      environmentTag:     Processing
  # CES Timetabling Job Executor
  - template:             ces/processing/timetabling_job_executor.yml@templates
    parameters:
      serviceName:        'CESTimetablingConsumers-${{ parameters.deploymentEnvironment }}'
      remoteRepo:         true
      extraVariables:     variables/common/ces-timetabling-job-executor-variables.yml
      environment:        ${{ parameters.deploymentEnvironment }}
      environmentTag:     Processing
  # CES Consumer Worker
  - template:             ces/processing/event_worker.yml@templates
    parameters:
      serviceName:        'CESConsumerWorkerService-${{ parameters.deploymentEnvironment }}'
      remoteRepo:         true
      environment:        ${{ parameters.deploymentEnvironment }}
      environmentTag:     Processing
  # CES Standard Consumers
  #- template:             ces/processing/standard_consumers.yml@templates
  #  parameters:
  #    serviceName:        'CESStandardConsumers-${{ parameters.deploymentEnvironment }}'
  #    licenceRequired:    true
  #    extraVariables:     variables/common/ces-standardapi-variables.yml
  #    remoteRepo:         true
  #    environment:        ${{ parameters.deploymentEnvironment }}
  #    environmentTag:     Processing

