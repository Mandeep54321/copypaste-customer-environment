---
trigger: none

parameters:
- name: deploymentEnvironment
  displayName: Deployment Environment
  type: string
  values:
  - bgms-prod
- name: useMaintenancePage
  displayName: Maintenance Page during deploy
  type: boolean
  default: true
- name: stopServices
  displayName: Stop services during database upgrade
  type: boolean
  default: true
- name: deployCESCore
  displayName: Deploy CES Core
  type: boolean
  default: true
- name: deployCESAPI
  displayName: Deploy CES API
  type: boolean
  default: true
- name: deployCESAuth
  displayName: Deploy CES Auth
  type: boolean
  default: true
- name: deployCESKiosk
  displayName: Deploy CES Kiosk
  type: boolean
  default: true
- name: deployCESWebApps
  displayName: Deploy CES Web Apps (TTK/TT/UI/Help/CEFHelp)
  type: boolean
  default: true

variables:
- template: ${{ parameters.deploymentEnvironment }}-pipeline-variables.yml
- group: ${{ parameters.deploymentEnvironment }}
- name: isDevEnv
  value: true
- name: certThumbprint
  value: '5861210431DFBCBD53666552950202833CB6AB53'
- name: urlname
  value: 'bgms'

#===============================================================================
#     ___                                  
#    / _ \___ ___ ___  __ _____________ ___
#   / , _/ -_|_-</ _ \/ // / __/ __/ -_|_-<
#  /_/|_|\__/___/\___/\_,_/_/  \__/\__/___/
#                                          
#===============================================================================
resources:
  repositories:
  - repository: templates
    type: git
    name: TechOps/deploy-ces
    ref: refs/tags/v1.0.50
  pipelines:
  #- pipeline: ces-database
  #  project: CES
  #  source: ces\ces-ci\ces-database-ci
  #  branch: release/release-R4-2024
  - pipeline: ces-build
    project: CES
    source: ces-generic-release-build-2.6.X
    branch: minor/release-2.5.6
  - pipeline: ces-sif
    project: CES
    source: ces-sif-build
    branch: minor/release-2.5.6
  - pipeline: ces-help
    project: CES
    source: ces\ces-help\ces-help
    branch: '2.5.5'
  - pipeline: ces-comms
    project: CES
    source: ces-communication-server-build
    branch: master
  - pipeline: ces-events
    project: CES
    source: ces\ces-events\ces-events
    branch: minor/release-2.5.5
  - pipeline: ces-comms-consumers
    project: CES
    source: ces-communication-center-consumers
    branch: minor/release-2.5.5
  - pipeline: service-seeding
    project: CES
    source: ces\ces-service-seeding\ces-service-seeding
    branch: release/release-2.5.0
  - pipeline: ces-kiosk-ui
    project: CES
    source: ces\ces-kiosk\ces-kiosk-ui-ci
    branch: minor/release-2.5.5
  - pipeline: ces-kiosk-api
    project: CES
    source: ces\ces-kiosk\ces-kiosk-api-ci
    branch: minor/release-2.5.5
  - pipeline: ces-standard-api
    project: CES
    source: ces\ces-standard\ces-standard-webapi-build
    branch: release/release-1.0.1
  - pipeline: ces-standard-consumers
    project: CES
    source: ces\ces-standard\ces-standard-consumers-build
    branch: release/release-1.0.1
  - pipeline: cef-build
    project: Maximise
    source: CEFinance-2.5.5
    branch: '2.5/2.5.5'
  - pipeline: portal
    project: CES
    source: ces-community-portal\ces-community-portal-full-release
    branch: release/release-R4-2024

stages:
#===============================================================================
#    _____                      __
#   / ___/__ ___  ___ _______ _/ /
#  / (_ / -_) _ \/ -_) __/ _ `/ / 
#  \___/\__/_//_/\__/_/  \_,_/_/  
#                                 
#===============================================================================
#-------------------------------------------------------------------------------
# Licence
#-------------------------------------------------------------------------------
- stage:                  licence
  displayName:            Licence
  jobs:
  # Generate Licence
  - template:             jobs/deploy_licence.yml@templates
    parameters:
      licenceDestination: $(licensing.output)
      remoteRepo:         true
      environment:        ${{ parameters.deploymentEnvironment }}
      environmentTags:    Licence

#-------------------------------------------------------------------------------
# Tools
#-------------------------------------------------------------------------------
- stage:                  tools
  displayName:            Tools
  variables:
  - template:             ../../common/legacy/tools-variables.yml
  jobs:
  # Initial Data Load Tool
  - template:             ces/tool/initialdataload_tool.yml@templates
    parameters:
      toolName:           'Initial Data Load Tool'
      remoteRepo:         true
      environment:        ${{ parameters.deploymentEnvironment }}
      environmentTag:     Tool
  # Archive Seeding Tool
  - template:             ces/tool/archiveseeding_tool.yml@templates
    parameters:
      toolName:           'Archive Job Seeding Tool'
      remoteRepo:         true
      environment:        ${{ parameters.deploymentEnvironment }}
      environmentTag:     Tool
  # General Seeding Tool
  - template:             ces/tool/generalseeding_tool.yml@templates
    parameters:
      toolName:           'General Job Seeding Tool'
      remoteRepo:         true
      environment:        ${{ parameters.deploymentEnvironment }}
      environmentTag:     Tool
  # Finance Seeding Tool
  - template:             cef/tool/financeseeding_tool.yml@templates
    parameters:
      toolName:           'Finance Job Seeding Tool'
      remoteRepo:         true
      environment:        ${{ parameters.deploymentEnvironment }}
      environmentTag:     Tool
  # Portal Seeding Tool
  - template:             portal/tool/portalseeding_tool.yml@templates
    parameters:
      toolName:           'Community Portal Job Seeding Tool'
      remoteRepo:         true
      environment:        ${{ parameters.deploymentEnvironment }}
      environmentTag:     Tool

#===============================================================================
#    _____________
#   / ___/ __/ __/
#  / /__/ _/_\ \  
#  \___/___/___/  
#                 
#===============================================================================
#-------------------------------------------------------------------------------
# CES Database
#-------------------------------------------------------------------------------
- stage:                  ces_database
  displayName:            CES Database
  variables:
  - template:             ../../common/legacy/ces-database-variables.yml
  jobs:
  # Stop Services
  #- ${{ if eq(parameters.stopServices, true) }}:
  #  - template:             jobs/stop_services.yml@templates
  #    parameters:
  #      remoteRepo:         true
  #      environment:        ${{ parameters.deploymentEnvironment }}
  #      environmentTag:     Processing
  #      serviceFilters:     '(CES|Comm).*${{ parameters.deploymentEnvironment }}$'
  # Database Upgrade
  - template:             ces/database/upgrade_ces_db.yml@templates
    parameters:
      remoteRepo:         true
      deploymentTimeout:  180 
      dbatoolsVersion:    '2.1.12'
      environment:        ${{ parameters.deploymentEnvironment }}
      environmentTag:     Tool

#-------------------------------------------------------------------------------
# CES Presentation
#-------------------------------------------------------------------------------
- stage:                  ces_presentation
  displayName:            CES Presentation
  dependsOn:
  - licence
  - ces_database
  variables:
  - template:             ../../common/legacy/ces-general-variables.yml
  jobs:
  # CES Core
  - template:             ces/web/ces_core.yml@templates
    parameters:
      siteName:           'CES Core ${{parameters.deploymentEnvironment}}'
      appPool:            'CES Core ${{parameters.deploymentEnvironment}}'
      licenceRequired:    true
      remoteRepo:         true
      environment:        ${{ parameters.deploymentEnvironment }}
      environmentTag:     Presentation
      deploy:             ${{ parameters.deployCESCore }}
      isDevEnv:           ${{ variables.isDevEnv }}
      useMaintenancePage: ${{ parameters.useMaintenancePage }}
      protocol:           'https'
      sslThumbprint:      ${{ variables.certThumbprint }}
      appCmd:             true
  # CES API
  - template:             ces/web/ces_api.yml@templates
    parameters:
      siteName:           'CES API ${{ parameters.deploymentEnvironment }}'
      appPool:            'CES API ${{ parameters.deploymentEnvironment }}'
      licenceRequired:    true
      remoteRepo:         true
      environment:        ${{ parameters.deploymentEnvironment }}
      environmentTag:     Presentation
      deploy:             ${{ parameters.deployCESAPI }}
      isDevEnv:           ${{ variables.isDevEnv }}
      useMaintenancePage: ${{ parameters.useMaintenancePage }}
      protocol:           'https'
      sslThumbprint:      ${{ variables.certThumbprint }}
      appCmd:             true
  # CES Auth
  - template:             ces/web/ces_auth.yml@templates
    parameters:
      siteName:           'CES Auth ${{ parameters.deploymentEnvironment }}'
      appPool:            'CES Auth ${{ parameters.deploymentEnvironment }}'
      extraVariables:     variables/common/ces-auth-variables.yml
      licenceRequired:    true
      remoteRepo:         true
      environment:        ${{ parameters.deploymentEnvironment }}
      environmentTag:     Presentation
      deploy:             ${{ parameters.deployCESAuth }}
      isDevEnv:           ${{ variables.isDevEnv }}
      useMaintenancePage: ${{ parameters.useMaintenancePage }}
      updateScripts:
      - name: 'Update-CESAuthAppSettings.ps1'
        arguments: '-SiteReference "az-${{ variables.urlname }}" -Domain "civica.education"'
      protocol:           'https'
      sslThumbprint:      ${{ variables.certThumbprint }}
      appCmd:             true
  # # Kiosk UI
  # - template:             ces/web/kiosk_ui.yml@templates
  #   parameters:
  #     siteName:           'CES Kiosk UI ${{ parameters.deploymentEnvironment }}'
  #     appPool:            'CES Kiosk UI ${{ parameters.deploymentEnvironment }}'
  #     extraVariables:     variables/common/ces-kiosk-variables.yml
  #     remoteRepo:         true
  #     environment:        ${{ parameters.deploymentEnvironment }}
  #     environmentTag:     Presentation
  #     deploy:             ${{ parameters.deployCESKiosk }}
  #     isDevEnv:           ${{ variables.isDevEnv }}
  #     useMaintenancePage: ${{ parameters.useMaintenancePage }}
  #     protocol:           'https'
  #     sslThumbprint:      ${{ variables.certThumbprint }}
  #     appCmd:             true
  # # Kiosk API
  # - template:             ces/web/kiosk_api.yml@templates
  #   parameters:
  #     siteName:           'CES Kiosk API ${{ parameters.deploymentEnvironment }}'
  #     appPool:            'CES Kiosk API ${{ parameters.deploymentEnvironment }}'
  #     licenceRequired:    true
  #     extraVariables:     variables/common/ces-kiosk-variables.yml
  #     remoteRepo:         true
  #     environment:        ${{ parameters.deploymentEnvironment }}
  #     environmentTag:     Presentation
  #     deploy:             ${{ parameters.deployCESKiosk }}
  #     isDevEnv:           ${{ variables.isDevEnv }}
  #     useMaintenancePage: ${{ parameters.useMaintenancePage }}
  #     protocol:           'https'
  #     sslThumbprint:      ${{ variables.certThumbprint }}
  #     appCmd:             true
  # CES Core / UI
  - template:             ces/web/ces_ui.yml@templates
    parameters:
      siteName:           'CES Core ${{ parameters.deploymentEnvironment }}'
      appName:            'UI'
      appPool:            'UI ${{ parameters.deploymentEnvironment }}'
      remoteRepo:         true
      environment:        ${{ parameters.deploymentEnvironment }}
      environmentTag:     Presentation
      deploy:             ${{ parameters.deployCESWebApps }}
      extraVariables:     variables/common/ces-webapp-variables.yml
      jsonConfigFiles:    
      - 'ClientApp\dist\app\config\environment.json'
      - 'ClientApp\dist\app\config\immediate.json'
  # CES Core / Help
  - template:             ces/web/ces_help.yml@templates
    parameters:
      siteName:           'CES Core ${{ parameters.deploymentEnvironment }}'
      appName:            'Help'
      appPool:            'Help ${{ parameters.deploymentEnvironment }}'
      remoteRepo:         true
      environment:        ${{ parameters.deploymentEnvironment }}
      environmentTag:     Presentation
      deploy:             ${{ parameters.deployCESWebApps }}
  # CES Core / CEFHelp
  - template:             ces/web/cef_help.yml@templates
    parameters:
      siteName:           'CES Core ${{ parameters.deploymentEnvironment }}'
      appName:            'CEFHelp'
      appPool:            'CEFHelp ${{ parameters.deploymentEnvironment }}'
      remoteRepo:         true
      environment:        ${{ parameters.deploymentEnvironment }}
      environmentTag:     Presentation
      deploy:             ${{ parameters.deployCESWebApps }}
  # CES Core / TeacherToolKit 
  - template:             ces/web/ces_teachertoolkit.yml@templates
    parameters:
      siteName:           'CES Core ${{ parameters.deploymentEnvironment }}'
      appName:            'TeacherToolkit'
      appPool:            'TeacherToolkit ${{ parameters.deploymentEnvironment }}'
      remoteRepo:         true
      environment:        ${{ parameters.deploymentEnvironment }}
      environmentTag:     Presentation
      deploy:             ${{ parameters.deployCESWebApps }}
      extraVariables:     variables/common/ces-webapp-variables.yml
      jsonConfigFiles:    
      - 'ClientApp\dist\app\config\environment.json'
      - 'ClientApp\dist\app\config\immediate.json'
  # CES Core / TimetableModelling
  - template:             ces/web/ces_timetablemodelling.yml@templates
    parameters:
      siteName:           'CES Core ${{ parameters.deploymentEnvironment }}'
      appName:            'TimetableModelling'
      appPool:            'TimetableModelling ${{ parameters.deploymentEnvironment }}'
      remoteRepo:         true
      environment:        ${{ parameters.deploymentEnvironment }}
      environmentTag:     Presentation
      deploy:             ${{ parameters.deployCESWebApps }}
      extraVariables:     variables/common/ces-webapp-variables.yml
      jsonConfigFiles:    
      - 'ClientApp\dist\apps\core\app\config\environment.json'
      - 'ClientApp\dist\apps\core\app\config\immediate.json'

